version: '3'

tasks:
  build:
    desc: Build the flights-overhead server binary
    dir: backend
    cmds:
      - go build -o bin/flights-overhead main.go

  build-pi:
    desc: Build the flights-overhead server binary for Raspberry Pi (Linux/arm64)
    dir: backend
    cmds:
      - GOOS=linux GOARCH=arm64 go build -o bin/flights-overhead-pi main.go

  deploy-pi:
    desc: Build and deploy the binary to Raspberry Pi via scp
    dir: backend
    deps: [build-pi]
    vars:
      PI_HOST: '{{.PI_HOST | default "pi24-bookworm.local"}}'
      PI_USER: '{{.PI_USER | default "pi"}}'
      PI_PATH: '{{.PI_PATH | default "~/flights-overhead"}}'
    cmds:
      - scp bin/flights-overhead-pi {{.PI_USER}}@{{.PI_HOST}}:{{.PI_PATH}}

  run:
    desc: Build and start the server with coordinates and firestore credentials
    dir: backend
    deps: [build]
    vars:
      LAT: '{{.LAT}}'
      LON: '{{.LON}}'
      TRACKER: '{{.TRACKER}}'
      PROJECT: '{{.PROJECT | default "flights-overhead"}}'
      CREDENTIALS: '{{.CREDENTIALS | default "../service-account-key.json"}}'
      WEBSERVER: '{{.WEBSERVER | default "localhost:8080"}}'
    preconditions:
      - sh: 'test -n "{{.TRACKER}}"'
        msg: "Error: TRACKER parameter is required. Run as: task run TRACKER=<tracker> LAT=<latitude> LON=<longitude> [PROJECT=<project_id>] [CREDENTIALS=<credentials_path>] [args...]"
      - sh: 'test -n "{{.LAT}}"'
        msg: "Error: LAT parameter is required. Run as: task run TRACKER=<tracker> LAT=<latitude> LON=<longitude> [PROJECT=<project_id>] [CREDENTIALS=<credentials_path>] [args...]"
      - sh: 'test -n "{{.LON}}"'
        msg: "Error: LON parameter is required. Run as: task run TRACKER=<tracker> LAT=<latitude> LON=<longitude> [PROJECT=<project_id>] [CREDENTIALS=<credentials_path>] [args...]"
    cmds:
      - ./bin/flights-overhead -tracker-addr="{{.TRACKER}}:30003" -http="{{.WEBSERVER}}" -lat="{{.LAT}}" -lon="{{.LON}}" -firestore-project="{{.PROJECT}}" -firestore-credentials="{{.CREDENTIALS}}" {{.CLI_ARGS}}

  test-functions:
    desc: Run unit tests for Firebase Cloud Functions
    dir: cloud-functions/functions
    cmds:
      - npm test

  deploy-functions:
    desc: Build and deploy Firebase Cloud Functions to production
    dir: cloud-functions
    cmds:
      - npx -y firebase-tools@latest deploy --only functions


